name: bump goast

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Update formula to latest goast release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="m-mizutani/goast"
          formula="Formula/goast.rb"

          latest_tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
          latest_version=${latest_tag#v}
          current_version=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$formula")

          echo "current=$current_version latest=$latest_version"
          if [ "$current_version" = "$latest_version" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          declare -A sha
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            asset="goast_${platform}.tar.gz"
            gh release download "$latest_tag" --repo "$repo" --pattern "$asset" --output "$asset"
            sha[$platform]=$(sha256sum "$asset" | cut -d' ' -f1)
            rm -f "$asset"
          done

          cat > "$formula" <<EOF
          class Goast < Formula
            desc "Static analysis tool for Go source AST with Rego"
            homepage "https://github.com/m-mizutani/goast"
            version "${latest_version}"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "https://github.com/m-mizutani/goast/releases/download/v#{version}/goast_darwin_arm64.tar.gz"
                sha256 "${sha[darwin_arm64]}"
              end
              on_intel do
                url "https://github.com/m-mizutani/goast/releases/download/v#{version}/goast_darwin_amd64.tar.gz"
                sha256 "${sha[darwin_amd64]}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/m-mizutani/goast/releases/download/v#{version}/goast_linux_arm64.tar.gz"
                sha256 "${sha[linux_arm64]}"
              end
              on_intel do
                url "https://github.com/m-mizutani/goast/releases/download/v#{version}/goast_linux_amd64.tar.gz"
                sha256 "${sha[linux_amd64]}"
              end
            end

            def install
              bin.install "goast"
            end

            test do
              assert_match "goast version #{version}", shell_output("#{bin}/goast --version")
            end
          end
          EOF

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bump-goast-${{ steps.bump.outputs.version }}
          commit-message: "goast ${{ steps.bump.outputs.version }}"
          title: "goast ${{ steps.bump.outputs.version }}"
          body: |
            Automated update of `goast` to ${{ steps.bump.outputs.version }}.

            Updated `version` and per-platform `sha256` from the upstream
            release assets at
            https://github.com/m-mizutani/goast/releases/tag/v${{ steps.bump.outputs.version }}.
          delete-branch: true
