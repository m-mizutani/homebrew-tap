name: bump goast

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Split from `bump` so that the hourly no-op run only resolves actions/checkout.
  # A single job would make "Set up job" download create-pull-request every hour,
  # which is what got rate limited (HTTP 429) by codeload.
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check out tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Compare formula version with latest goast release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="m-mizutani/goast"
          formula="Formula/goast.rb"

          latest_tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
          latest_version=${latest_tag#v}
          # The formula carries no `version` field: brew audit rejects it as
          # redundant with the version scanned from the release URL.
          current_version=$(sed -n 's|.*/releases/download/v\([^/]*\)/.*|\1|p' "$formula" | head -n 1)

          if [ -z "$current_version" ]; then
            echo "Could not read the current version from $formula" >&2
            exit 1
          fi

          echo "current=$current_version latest=$latest_version"
          if [ "$current_version" = "$latest_version" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed=true"
            echo "version=$latest_version"
            echo "tag=$latest_tag"
          } >> "$GITHUB_OUTPUT"

  bump:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Update formula to latest goast release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ needs.check.outputs.tag }}
          LATEST_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail

          repo="m-mizutani/goast"
          formula="Formula/goast.rb"
          latest_tag="$LATEST_TAG"
          latest_version="$LATEST_VERSION"

          declare -A sha
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            asset="goast_${platform}.tar.gz"
            gh release download "$latest_tag" --repo "$repo" --pattern "$asset" --output "$asset"
            sha[$platform]=$(sha256sum "$asset" | cut -d' ' -f1)
            rm -f "$asset"
          done

          cat > "$formula" <<EOF
          class Goast < Formula
            desc "Static analysis tool for Go source AST with Rego"
            homepage "https://github.com/m-mizutani/goast"
            license "Apache-2.0"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "https://github.com/m-mizutani/goast/releases/download/v${latest_version}/goast_darwin_arm64.tar.gz"
                sha256 "${sha[darwin_arm64]}"
              end
              on_intel do
                url "https://github.com/m-mizutani/goast/releases/download/v${latest_version}/goast_darwin_amd64.tar.gz"
                sha256 "${sha[darwin_amd64]}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/m-mizutani/goast/releases/download/v${latest_version}/goast_linux_arm64.tar.gz"
                sha256 "${sha[linux_arm64]}"
              end
              on_intel do
                url "https://github.com/m-mizutani/goast/releases/download/v${latest_version}/goast_linux_amd64.tar.gz"
                sha256 "${sha[linux_amd64]}"
              end
            end

            def install
              bin.install "goast"
            end

            test do
              assert_match "goast version #{version}", shell_output("#{bin}/goast --version")
            end
          end
          EOF

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bump-goast-${{ needs.check.outputs.version }}
          commit-message: "goast ${{ needs.check.outputs.version }}"
          title: "goast ${{ needs.check.outputs.version }}"
          body: |
            Automated update of `goast` to ${{ needs.check.outputs.version }}.

            Updated the release URLs and per-platform `sha256` from the
            upstream release assets at
            https://github.com/m-mizutani/goast/releases/tag/v${{ needs.check.outputs.version }}.
          delete-branch: true
